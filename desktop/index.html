<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; script-src 'self'">
<title>Fairy</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar">
<div class="status"><span id="dot"></span><span id="status">Starting models...</span></div>
<div class="controls"><button id="screen">Share screen</button><button id="control" aria-pressed="false">Control: off</button><button id="vtube" aria-pressed="false">VTube: off</button><button id="reset">New conversation</button></div>
</header>
<div id="activity" aria-live="polite"></div>
<div id="messages" aria-live="polite"></div>
<div class="composer">
<div class="compose-row"><textarea id="input" placeholder="Message" rows="1" maxlength="4000"></textarea><button id="send" disabled>Send</button></div>
<div class="actions"><button id="mic" disabled>Record</button><button id="stop">Stop response</button></div>
</div>
<dialog id="picker"><h2>Choose what to share</h2><div id="sources"></div><button id="close-picker">Cancel</button></dialog>
<script src="renderer.js"></script>
</body></html>
